# Example host configuration. Copy this file to config/host.conf (which is never committed) and edit it.
# Precedence for every value: environment variable (named in brackets) > this file > built-in default.
# Only advertise_host has no default: it is the one value that must come from you. Full reference: docs/configuration.md

[server]
# The address the Stick uses to reach this Mac, on the Wi-Fi network the Stick joins. REQUIRED. [STICK_ADVERTISE_HOST]
# An IPv4 address (list yours with: python3 stick_config.py suggest-address). It must not be 127.0.0.1 or 0.0.0.0.
# Give the Mac a fixed address (a DHCP reservation in the router); if it changes, the Stick cannot find the server.
# advertise_host = 192.0.2.10        <- remove the leading '#' and put YOUR Mac's address here (192.0.2.10 is only a documentation placeholder)

# The address the server listens on. [STICK_BIND_HOST]
# Default: the same as advertise_host (the server then listens on that one address only).
# Use 0.0.0.0 to listen on every interface (needed if advertise_host is a host name). The panel is NOT affected: it always listens on 127.0.0.1 only.
# bind_host = 192.0.2.10

# TCP port of the Stick's API (the Stick is configured with this port) [STICK_DEVICE_PORT] (default 8000)
# device_port = 8000

# TCP port of the browser panel, loopback only [STICK_PANEL_PORT] (default 8001)
# panel_port = 8001

[device]
# USB serial device of the Stick, used only by the Stick tools. [STICK_PORT]
# Leave empty to auto-select when exactly one /dev/cu.usbmodem* device is connected.
# usb_port = /dev/cu.usbmodemXXXX

[paths]
# Locations. Relative paths are relative to this project folder; "~" is expanded. Defaults shown.
# voice_env      = voice-env        # Python environment of the server            [STICK_VOICE_ENV]
# tts_env        = tts-env312       # Python environment of the Hebrew TTS        [STICK_TTS_ENV]
# tools_env      = tools-env        # environment holding mpremote                [STICK_TOOLS_ENV]
# mpremote       =                  # explicit mpremote program (default: <tools_env>/bin/mpremote) [MPREMOTE]
# claude         =                  # Claude Code CLI (default: found on PATH)    [STICK_CLAUDE]
# ffmpeg         =                  # ffmpeg (default: found on PATH)             [STICK_FFMPEG]
# models_dir     = tts-models       # Hebrew TTS model files                      [STICK_MODELS_DIR]
# whisper_dir    = whisper-model    # pinned speech-recognition model (used only if it exists; otherwise the Hugging Face cache) [STICK_WHISPER_DIR]
# data_dir       = data             # settings database and reminder audio        [STICK_DATA_DIR]
# secrets_dir    = secrets          # device key                                  [STICK_SECRETS_DIR]
# recordings_dir = recordings       # latest recording, transcript and reply      [STICK_RECORDINGS_DIR]
